<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 股票分析面板</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
    <div class="container">
        <!-- 顶部导航栏 -->
        <header>
            <h1>AI 股票分析面板</h1>
        </header>

        <!-- 搜索区 -->
        <div class="search-box">
            <input
                type="text"
                id="stockInput"
                placeholder="输入股票代码，如 AAPL / 000001"
                maxlength="10"
                autocomplete="off"
            />
            <button id="analyzeBtn">分析</button>
        </div>

        <!-- K线图 -->
        <div class="card" id="chartCard" style="display:none;">
            <div class="card-title">K线走势</div>
            <div id="chartContainer"></div>
        </div>

        <!-- 行情卡片 -->
        <div class="card" id="stockCard" style="display:none;">
            <div class="card-title">实时行情</div>
            <div class="stock-main">
                <span id="stockSymbol" class="symbol-large"></span>
                <span id="stockPrice" class="price-large"></span>
            </div>
            <div class="stock-details">
                <span id="stockChange"></span>
                <span id="stockVolume"></span>
            </div>
        </div>

        <!-- AI 分析卡片 -->
        <div class="card" id="analysisCard" style="display:none;">
            <div class="card-title">AI 分析</div>
            <div class="analysis-tags">
                <span id="sentimentTag" class="tag"></span>
                <span id="riskTag" class="tag"></span>
            </div>
            <p id="aiSummary" class="summary-text"></p>
        </div>

        <!-- 调试面板 -->
        <div class="card" id="debugCard" style="display:none;">
            <div class="card-title" style="display:flex;justify-content:space-between;align-items:center;">
                <span>API 原始返回数据</span>
                <button id="toggleDebug" style="background:#333;border:none;color:#aaa;cursor:pointer;font-size:12px;padding:4px 8px;border-radius:4px;">收起</button>
            </div>
            <div id="debugContent"></div>
        </div>

        <!-- 小字提示行 -->
        <div style="text-align:center;margin-top:8px;">
            <button id="showDebugBtn" class="debug-btn">查看 API 返回数据</button>
            <span style="color:#666;font-size:12px;margin-left:12px;">按 F12 → Console 查看详细日志</span>
        </div>

        <!-- 历史记录区 -->
        <div class="card" id="historySection">
            <div class="card-title">最近分析</div>
            <div id="historyList">
                <p class="empty-hint">暂无记录</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
